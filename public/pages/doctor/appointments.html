<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>المواعيد | نظام العيادة</title>
    <link rel="stylesheet" href="../../assets/css/bootstrap.min.css">
    <link rel="stylesheet" href="../../assets/css/main.css">
    <link rel="stylesheet" href="../../assets/css/doctor.css">
  </head>
  <body>
    <div class="app-layout">
      <aside class="sidebar">
        <div class="sidebar-brand"><span class="brand-mark">ط</span><span>نظام العيادة</span></div>
        <nav class="nav-menu">
          <a data-page="doctor-dashboard" href="dashboard.html">لوحة الطبيب</a>
          <a data-page="doctor-appointments" href="appointments.html">المواعيد</a>
          <a data-page="doctor-patient" href="patient-details.html">ملف مريض</a>
          <a data-page="doctor-consultations" href="consultations.html">الاستشارات</a>
        </nav>
      </aside>
      <main class="main">
        <header class="topbar">
          <div class="page-title"><h1>المواعيد</h1><p>كل مواعيد الطبيب العام</p></div>
          <div class="user-chip"><span class="avatar" data-avatar></span><span data-user-name></span><button class="btn btn-outline-secondary" data-logout type="button">تسجيل الخروج</button></div>
        </header>

        <section class="toolbar three">
          <select id="statusFilter" class="form-select">
            <option value="All">كل الحالات</option>
            <option value="Pending">Pending</option>
            <option value="Completed">Completed</option>
            <option value="Cancelled">Cancelled</option>
          </select>
          <input id="dateFilter" class="form-control" type="date">
          <input id="patientSearch" class="form-control" type="search" placeholder="بحث باسم المريض">
        </section>

        <section class="table-wrap">
          <table class="table">
            <thead><tr><th>اسم المريض</th><th>التاريخ</th><th>الوقت</th><th>الحالة</th><th>التشخيص</th><th>العمليات</th></tr></thead>
            <tbody id="appointmentsTable"></tbody>
          </table>
        </section>
      </main>
    </div>

    <script src="../../assets/js/config.js"></script>
    <script src="../../assets/js/utils.js"></script>
    <script src="../../assets/js/auth.js"></script>
    <script src="../../assets/js/guard.js"></script>
    <script src="../../assets/js/doctor/appointments.js"></script>
  </body>
</html>
