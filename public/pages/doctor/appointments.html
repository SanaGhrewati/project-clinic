<!doctype html>
<html lang="ar" dir="rtl">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>المواعيد | نظام العيادة</title>
        <link rel="stylesheet" href="../../assets/css/bootstrap.min.css" />
        <link rel="stylesheet" href="../../assets/css/main.css" />
        <link rel="stylesheet" href="../../assets/css/doctor.css" />
    </head>
    <body>
        <div class="app-layout">
            <aside class="sidebar">
                <div class="sidebar-brand">
                    <span class="brand-mark">ط</span><span>نظام العيادة</span>
                </div>
                <nav class="nav-menu">
                    <a data-page="doctor-dashboard" href="dashboard.html"
                        >لوحة الطبيب</a
                    >
                    <a data-page="doctor-appointments" href="appointments.html"
                        >المواعيد</a
                    >
                    <a data-page="doctor-patient" href="patient-details.html"
                        >ملف مريض</a
                    >
                    <a
                        data-page="doctor-consultations"
                        href="consultations.html"
                        >الاستشارات</a
                    >
                </nav>
            </aside>
            <main class="main">
                <header class="topbar">
                    <div class="page-title">
                        <h1>المواعيد</h1>
                        <p>كل مواعيد الطبيب العام</p>
                    </div>
                    <div class="user-chip">
                        <span class="avatar" data-avatar></span
                        ><span data-user-name></span
                        ><button
                            class="btn btn-outline-secondary"
                            data-logout
                            type="button"
                        >
                            تسجيل الخروج
                        </button>
                    </div>
                </header>

                <div class="mb-3">
                    <button
                        id="addAppointmentBtn"
                        class="btn btn-primary"
                        type="button"
                    >
                        إضافة موعد
                    </button>
                </div>

                <section class="toolbar three">
                    <select id="statusFilter" class="form-select">
                        <option value="All">كل الحالات</option>
                        <option value="available">متاح</option>
                        <option value="booked">محجوز</option>
                        <option value="completed">مكتمل</option>
                        <option value="cancelled">ملغى</option>
                    </select>
                    <input id="dateFilter" class="form-control" type="date" />
                    <input
                        id="patientSearch"
                        class="form-control"
                        type="search"
                        placeholder="بحث باسم المريض"
                    />
                </section>

                <div
                    id="appointmentsMessage"
                    class="alert alert-danger d-none mb-3"
                ></div>

                <section class="table-wrap">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>اسم المريض</th>
                                <th>التاريخ</th>
                                <th>الوقت</th>
                                <th>الحالة</th>
                                <th>التشخيص</th>
                                <th>العمليات</th>
                            </tr>
                        </thead>
                        <tbody id="appointmentsTable"></tbody>
                    </table>
                </section>
            </main>
        </div>

        <div id="appointmentModal" class="modal-backdrop">
            <section class="modal-panel">
                <div class="modal-head">
                    <h2>إضافة موعد متاح</h2>
                    <button
                        class="btn btn-outline-secondary"
                        type="button"
                        data-close-modal
                    >
                        إغلاق
                    </button>
                </div>
                <form id="appointmentForm">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label" for="appointmentDate"
                                >التاريخ</label
                            >
                            <input
                                id="appointmentDate"
                                class="form-control"
                                name="date"
                                type="date"
                                required
                            />
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label" for="appointmentTime"
                                >الوقت</label
                            >
                            <input
                                id="appointmentTime"
                                class="form-control"
                                name="time"
                                type="time"
                                required
                            />
                        </div>
                    </div>
                    <div
                        id="appointmentFormMessage"
                        class="alert alert-success d-none mb-3"
                    ></div>
                    <div id="addedTimesList"></div>
                    <div class="actions">
                        <button class="btn btn-primary" type="submit">
                            حفظ الموعد
                        </button>
                        <button
                            class="btn btn-outline-secondary"
                            type="button"
                            data-close-modal
                        >
                            إغلاق
                        </button>
                    </div>
                </form>
            </section>
        </div>

        <script src="../../assets/js/config.js"></script>
        <script src="../../assets/js/utils.js"></script>
        <script src="../../assets/js/auth.js"></script>
        <script src="../../assets/js/guard.js"></script>
        <script src="../../assets/js/doctor/appointments.js"></script>
    </body>
</html>
