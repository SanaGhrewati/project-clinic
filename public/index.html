<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>تسجيل الدخول | نظام العيادة</title>
    <link rel="stylesheet" href="assets/css/bootstrap.min.css">
    <link rel="stylesheet" href="assets/css/main.css">
    <link rel="stylesheet" href="assets/css/auth.css">
  </head>
  <body class="auth-page">
    <main class="auth-card">
      <span class="brand-mark">ط</span>
      <h1 class="mb-2">تسجيل الدخول</h1>
      <p class="text-muted mb-4">بوابة الأطباء والإدارة</p>

      <form id="loginForm">
        <div id="loginError" class="alert alert-danger d-none mb-3"></div>
        <div class="mb-3">
          <label class="form-label" for="email">البريد الإلكتروني</label>
          <input id="email" class="form-control" name="email" type="email" autocomplete="email" required>
        </div>
        <div class="mb-3">
          <label class="form-label" for="password">كلمة المرور</label>
          <input id="password" class="form-control" name="password" type="password" autocomplete="current-password" required>
        </div>
        <button class="btn btn-primary w-100" type="submit">دخول</button>
      </form>

      <!-- <div class="demo-logins">
        <strong>حسابات تجريبية</strong>
        <span>admin@clinic.test / 123456</span>
        <span>doctor@clinic.test / 123456</span>
        <span>lab@clinic.test / 123456</span>
        <span>radiology@clinic.test / 123456</span>
      </div> -->
    </main>

    <script src="assets/js/config.js"></script>
    <script src="assets/js/utils.js"></script>
    <script src="assets/js/auth.js"></script>
    <script>
      const existingUser = getCurrentUser();
      if (existingUser) redirectByUserType(existingUser);

      document.getElementById("loginForm").addEventListener("submit", async (event) => {
        event.preventDefault();
        const data = new FormData(event.currentTarget);
        const submitButton = event.currentTarget.querySelector('button[type="submit"]');
        submitButton.disabled = true;
        try {
          const user = await login(String(data.get("email")), String(data.get("password")));
          redirectByUserType(user);
        } catch (error) {
          showAlert("loginError", error.message, "danger");
        } finally {
          submitButton.disabled = false;
        }
      });
    </script>
  </body>
</html>
